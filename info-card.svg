    .link-val { fill: #4DA6FF; font-weight: 600; text-decoration: underline; }
    .status-pill { fill: rgba(39, 201, 63, 0.15); stroke: rgba(39, 201, 63, 0.5); rx: 6px; }
    .status-text { font-family: "Fira Code", monospace; font-size: 11.5px; fill: #27C93F; font-weight: 800; letter-spacing: 0.5px; }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.2; } }
    .cursor { fill: #FFD700; animation: blink 1s infinite; }
  </style>
