    .status-pill { fill: rgba(39, 201, 63, 0.12); stroke: rgba(39, 201, 63, 0.4); rx: 4px; }
    .status-text { font-family: "Fira Code", monospace; font-size: 9.5px; fill: #27C93F; font-weight: 700; }
    .tag-pill { fill: rgba(212, 175, 55, 0.12); stroke: rgba(212, 175, 55, 0.35); rx: 3px; }
    .tag-text { font-family: "Fira Code", monospace; font-size: 9px; fill: #FFD700; font-weight: 600; }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.2; } }
    .cursor { fill: #FFD700; animation: blink 1s infinite; }
